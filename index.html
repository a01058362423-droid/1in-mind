<!DOCTYPE html>
<html lang="ko" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 Saju Palja 사주팔자</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg-gradient:linear-gradient(135deg,#6a3093,#a044ff);
    --container-bg:#fff;
    --container-shadow:rgba(0,0,0,.2);
    --text-heading:#2c1250;
    --text-body:#5c5470;
    --card-bg:#f7f5fb;
    --card-shadow:rgba(0,0,0,.1);
    --accent:#d4af37;
    --accent-hover:#b9932e;
    --toggle-bg:rgba(255,255,255,.3);
    --toggle-border:rgba(255,255,255,.6);
    --tab-bg:#efe9f7;
    --tab-active-bg:#6a3093;
    --tab-active-text:#fff;
    --border:rgba(0,0,0,.08);
}

[data-theme="dark"]{
    --bg-gradient:linear-gradient(135deg,#0f0c29,#302b63);
    --container-bg:#1e1b2e;
    --container-shadow:rgba(0,0,0,.5);
    --text-heading:#f1eaff;
    --text-body:#c7bfe0;
    --card-bg:#2a2540;
    --card-shadow:rgba(0,0,0,.35);
    --accent:#e8c766;
    --accent-hover:#d4af37;
    --toggle-bg:rgba(255,255,255,.1);
    --toggle-border:rgba(255,255,255,.3);
    --tab-bg:#2a2540;
    --tab-active-bg:#a044ff;
    --tab-active-text:#fff;
    --border:rgba(255,255,255,.08);
}

body{
    font-family:'Segoe UI',sans-serif;
    background:var(--bg-gradient);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:30px;
    transition:background .3s ease;
}

.top-controls{
    position:fixed;
    top:20px;
    right:20px;
    display:flex;
    gap:10px;
    z-index:10;
}

.top-controls button,
.top-controls select{
    background:var(--toggle-bg);
    border:1px solid var(--toggle-border);
    color:#fff;
    padding:10px 16px;
    border-radius:30px;
    font-size:15px;
    cursor:pointer;
    backdrop-filter:blur(4px);
    transition:.3s;
    font-family:inherit;
}

.top-controls select option{
    color:#2c1250;
}

.top-controls button:hover,
.top-controls select:hover{
    background:var(--toggle-border);
}

.container{
    width:100%;
    max-width:900px;
    background:var(--container-bg);
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 40px var(--container-shadow);
    text-align:center;
    transition:background .3s ease,box-shadow .3s ease;
    margin:0 auto;
}

h1{
    color:var(--text-heading);
    margin-bottom:6px;
}

.subtitle{
    color:var(--text-body);
    margin-bottom:25px;
    font-size:14px;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:30px;
}

.tab-btn{
    background:var(--tab-bg);
    color:var(--text-body);
    border:none;
    padding:10px 18px;
    border-radius:30px;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

.tab-btn.active{
    background:var(--tab-active-bg);
    color:var(--tab-active-text);
    font-weight:bold;
}

.tab-panel{
    display:none;
    text-align:left;
}

.tab-panel.active{
    display:block;
}

.form-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:16px;
    align-items:flex-end;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:13px;
    color:var(--text-body);
    font-weight:bold;
}

.field input,
.field select{
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card-bg);
    color:var(--text-heading);
    font-family:inherit;
    font-size:14px;
}

.btn{
    background:var(--accent);
    color:#2c1250;
    border:none;
    padding:12px 28px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:var(--accent-hover);
    transform:scale(1.03);
}

.pillars{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px;
    margin-top:24px;
}

.pillar-card{
    background:var(--card-bg);
    border-radius:14px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 4px 12px var(--card-shadow);
}

.pillar-card .label{
    font-size:12px;
    color:var(--text-body);
    margin-bottom:8px;
}

.pillar-card .gz{
    font-size:26px;
    font-weight:bold;
    color:var(--text-heading);
}

.pillar-card .oheng{
    margin-top:8px;
    font-size:12px;
    padding:3px 10px;
    border-radius:20px;
    display:inline-block;
    color:#fff;
}

.oheng-bars{
    margin-top:26px;
}

.oheng-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
}

.oheng-row .name{
    width:60px;
    font-size:13px;
    color:var(--text-body);
    font-weight:bold;
}

.oheng-row .bar-track{
    flex:1;
    background:var(--card-bg);
    border-radius:10px;
    height:14px;
    overflow:hidden;
}

.oheng-row .bar-fill{
    height:100%;
    border-radius:10px;
    transition:width .4s ease;
}

.oheng-row .count{
    width:20px;
    text-align:right;
    font-size:13px;
    color:var(--text-body);
}

.result-box{
    margin-top:20px;
    background:var(--card-bg);
    border-radius:14px;
    padding:20px;
    line-height:1.7;
    color:var(--text-heading);
    font-size:14px;
}

.fortune-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px;
    margin-top:20px;
}

.fortune-card{
    background:var(--card-bg);
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 12px var(--card-shadow);
}

.fortune-card h3{
    font-size:14px;
    color:var(--accent-hover);
    margin-bottom:8px;
}

.fortune-card p{
    font-size:13px;
    color:var(--text-heading);
    line-height:1.6;
}

.compat-score{
    text-align:center;
    margin-top:20px;
}

.compat-score .num{
    font-size:48px;
    font-weight:bold;
    color:var(--accent-hover);
}

.compat-score .num span{
    font-size:22px;
}

.hint{
    font-size:12px;
    color:var(--text-body);
    margin-top:6px;
}

.empty-hint{
    color:var(--text-body);
    font-size:14px;
    padding:30px 10px;
    text-align:center;
}
</style>

</head>
<body>

<div class="top-controls">
    <select id="langSelect" onchange="setLang(this.value)"></select>
    <button onclick="toggleTheme()" id="themeToggle">🌙 다크모드</button>

        <p class="hint" id="sajuHint">※ 절기(입춘 등) 경계는 태양 황경 기반으로 정밀 계산됩니다. 다만 출생시간은 2시간 단위로만 입력받기 때문에, 절입 시각이 임박한 경우 약간의 오차가 있을 수 있습니다.</p>

        <div id="sajuResult"></div>
    </div>

    <div class="tab-panel" id="tab-today">
        <div class="form-row">
            <div class="field">
                <label for="todayBirth" id="todayBirthLabel">생년월일 (선택, 입력 시 개인화)</label>
                <input type="date" id="todayBirth">

            <button class="btn" onclick="calcToday()" id="todayBtn">오늘의 운세 보기</button>
        </div>
        <div id="todayResult"></div>
    </div>

    <div class="tab-panel" id="tab-match">
        <div class="form-row">
            <div class="field">
                <label for="matchName1" id="matchName1Label">이름 A</label>
                <input type="text" id="matchName1" placeholder="이름 (선택)">
            </div>
            <div class="field">
                <label for="matchDate1" id="matchDate1Label">생년월일 A</label>
                <input type="date" id="matchDate1">
            </div>
        </div>
        <div class="form-row">
            <div class="field">
                <label for="matchName2" id="matchName2Label">이름 B</label>
                <input type="text" id="matchName2" placeholder="이름 (선택)">
            </div>
            <div class="field">
                <label for="matchDate2" id="matchDate2Label">생년월일 B</label>
                <input type="date" id="matchDate2">
            </div>
            <button class="btn" onclick="calcMatch()" id="matchBtn">궁합 보기</button>
        </div>
        <div id="matchResult"></div>
    </div>

    <div class="tab-panel" id="tab-ai">
        <p class="hint" id="aiHint">먼저 "사주판 계산" 탭에서 사주를 계산하면, 그 결과를 바탕으로 해설을 생성합니다. (외부 AI API 없이 규칙 기반으로 자동 생성되는 해설입니다.)</p>
        <div class="form-row">
            <button class="btn" onclick="calcAiExplain()" id="aiBtn">AI 해설 생성하기</button>
        </div>
        <div id="aiResult"></div>
    </div>

</div>

<script>

const UI_TEXT = {

        subtitle: "생년월일시로 나의 명식을 확인하고, 오늘의 운세와 궁합까지 살펴보세요.",

function renderHourOptions(){
    const sel = document.getElementById("sajuHour");
    const prev = sel.value;
    sel.innerHTML = HOUR_OPTIONS.map(o => `<option value="${o.value}">${o[LANG.current]}</option>`).join("");

function toggleLang(){
    LANG.current = LANG.current === "ko" ? "en" : "ko";
    localStorage.setItem("saju-lang", LANG.current);
    applyStaticText();
    ["sajuResult","todayResult","matchResult","aiResult"].forEach(id=>{
        document.getElementById(id).innerHTML = "";
    });
}

function hashString(str){
    let h = 0;
    for(let i=0;i<str.length;i++){
        h = (h*31 + str.charCodeAt(i)) | 0;
    }
    return Math.abs(h);
}

function toJD(y,m,d,hour){
    let Y=y, M=m;
    if(M<=2){ Y-=1; M+=12; }
    const A = Math.floor(Y/100);
    const B = 2-A+Math.floor(A/4);
    return Math.floor(365.25*(Y+4716)) + Math.floor(30.6001*(M+1)) + d + B - 1524.5 + hour/24;
}

// Low-precision solar apparent longitude (Meeus ch.25), accurate to ~0.01deg - enough for day-level solar-term boundaries.
function solarLongitude(jd){
    const T = (jd-2451545.0)/36525;
    const norm = x => ((x%360)+360)%360;
    const L0 = norm(280.46646 + 36000.76983*T + 0.0003032*T*T);
    const M = norm(357.52911 + 35999.05029*T - 0.0001537*T*T);
    const Mr = M*Math.PI/180;
    const C = (1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)
            + (0.019993-0.000101*T)*Math.sin(2*Mr)
            + 0.000289*Math.sin(3*Mr);
    const trueLong = L0+C;
    const omega = 125.04-1934.136*T;
    const apparent = trueLong - 0.00569 - 0.00478*Math.sin(omega*Math.PI/180);
    return norm(apparent);
}

const SEASON_TERMS = [
    { m:1, d:6,  lon:285, zhi:1  },
    { m:2, d:4,  lon:315, zhi:2  },
    { m:3, d:6,  lon:345, zhi:3  },
    { m:4, d:5,  lon:15,  zhi:4  },
    { m:5, d:6,  lon:45,  zhi:5  },
    { m:6, d:6,  lon:75,  zhi:6  },
    { m:7, d:7,  lon:105, zhi:7  },
    { m:8, d:8,  lon:135, zhi:8  },
    { m:9, d:8,  lon:165, zhi:9  },
    { m:10,d:8,  lon:195, zhi:10 },
    { m:11,d:7,  lon:225, zhi:11 },
    { m:12,d:7,  lon:255, zhi:0  }
];

function findTermJD(year, term){
    const guess = toJD(year, term.m, term.d, 12);
    let lo = guess-10, hi = guess+10;
    const diffAt = jd => {
        const diff = solarLongitude(jd) - term.lon;
        return ((diff+180)%360+360)%360-180;
    };
    for(let i=0;i<40;i++){
        const mid = (lo+hi)/2;
        if(diffAt(mid) < 0) lo = mid; else hi = mid;
    }
    return (lo+hi)/2;
}

const termCache = {};
function getYearTerms(year){
    if(!termCache[year]){
        termCache[year] = SEASON_TERMS.map(t => ({ zhi:t.zhi, jd:findTermJD(year,t) }));
    }
    return termCache[year];
}

function getYearGanZhi(y,m,d,hour){
    const inputJD = toJD(y,m,d, hour===null||hour===undefined ? 12 : hour);
    const ipchunJD = getYearTerms(y).find(t=>t.zhi===2).jd;
    const year = inputJD < ipchunJD ? y-1 : y;
    const ganIdx = ((year-4)%10+10)%10;
    const jiIdx = ((year-4)%12+12)%12;
    return { ganIdx, jiIdx, sajuYear:year };
}

function getMonthZhiIndex(y,m,d,hour){
    const inputJD = toJD(y,m,d, hour===null||hour===undefined ? 12 : hour);
    const terms = getYearTerms(y);
    let zhi = null;
    for(const term of terms){
        if(term.jd <= inputJD) zhi = term.zhi;
    }
    return zhi===null ? 0 : zhi;
}

const WOLGUN_START = { 0:2, 5:2, 1:4, 6:4, 2:6, 7:6, 3:8, 8:8, 4:0, 9:0 };

function getMonthGanZhi(yearGanIdx, y, m, d, hour){
    const jiIdx = getMonthZhiIndex(y,m,d,hour);
    const offset = ZHI_ORDER_FROM_IN.indexOf(jiIdx);
    const ganIdx = (WOLGUN_START[yearGanIdx] + offset) % 10;
    return { ganIdx, jiIdx };
}

// Epoch reference: 1900-01-31(UTC) is a known 갑자일 in the traditional 60-day cycle.
function getDayGanZhi(y,m,d,hour){
    let date = new Date(Date.UTC(y, m-1, d));
    if(hour!==null && hour>=23){
        date = new Date(date.getTime() + 86400000);
    }
    const ref = new Date(Date.UTC(1900,0,31));
    const diffDays = Math.floor((date - ref)/86400000);
    const idx = ((diffDays%60)+60)%60;
    return { ganIdx: idx%10, jiIdx: idx%12 };
}

function hourToZhiIndex(hour){
    if(hour===23) return 0;
    return Math.floor((hour+1)/2)%12;
}

const SIJU_START = { 0:0, 5:0, 1:2, 6:2, 2:4, 7:4, 3:6, 8:6, 4:8, 9:8 };

function getHourGanZhi(dayGanIdx, hour){
    const jiIdx = hourToZhiIndex(hour);
    const ganIdx = (SIJU_START[dayGanIdx] + jiIdx) % 10;
    return { ganIdx, jiIdx };
}

function pillarText(ganIdx, jiIdx){
    return LANG.current==="ko" ? (CHEONGAN[ganIdx]+JIJI[jiIdx]) : (CHEONGAN_ROMAN[ganIdx]+"-"+JIJI_ROMAN[jiIdx]);
}

function pillarOheng(ganIdx, jiIdx){
    return [CHEONGAN_OHENG[ganIdx], JIJI_OHENG[jiIdx]];
}

let lastSajuResult = null;

function calcSaju(){
    const dateVal = document.getElementById("sajuDate").value;
    const hourVal = document.getElementById("sajuHour").value;
    const box = document.getElementById("sajuResult");

    if(!dateVal){
        box.innerHTML = `<p class="empty-hint">${t("sajuEmptyHint")}</p>`;
        return;
    }

    const [y,m,d] = dateVal.split("-").map(Number);
    const hour = hourVal==="unknown" ? null : Number(hourVal);

    const year = getYearGanZhi(y,m,d,hour);
    const month = getMonthGanZhi(year.ganIdx, y, m, d, hour);
    const day = getDayGanZhi(y,m,d,hour);
    const timePillar = hour===null ? null : getHourGanZhi(day.ganIdx, hour);

    const pillars = [
        { label:t("pillarYear"), ganIdx:year.ganIdx, jiIdx:year.jiIdx },
        { label:t("pillarMonth"), ganIdx:month.ganIdx, jiIdx:month.jiIdx },
        { label:t("pillarDay"), ganIdx:day.ganIdx, jiIdx:day.jiIdx },
    ];
    if(timePillar) pillars.push({ label:t("pillarHour"), ganIdx:timePillar.ganIdx, jiIdx:timePillar.jiIdx });

    const ohengCount = { "목":0, "화":0, "토":0, "금":0, "수":0 };
    pillars.forEach(p=>{
        const [g,j] = pillarOheng(p.ganIdx, p.jiIdx);
        ohengCount[g]++;
        ohengCount[j]++;
    });

    let html = '<div class="pillars">';
    pillars.forEach(p=>{
        const [g] = pillarOheng(p.ganIdx, p.jiIdx);
        html += `
        <div class="pillar-card">
            <div class="label">${p.label}</div>
            <div class="gz">${pillarText(p.ganIdx,p.jiIdx)}</div>
            <div class="oheng" style="background:${OHENG_COLOR[g]}">${ohengLabel(g)}</div>
        </div>`;
    });
    if(!timePillar){
        html += `
        <div class="pillar-card">
            <div class="label">${t("pillarHour")}</div>
            <div class="gz" style="font-size:14px;color:var(--text-body)">${t("hourUnknownPillar")}</div>
        </div>`;
    }
    html += '</div>';

    html += '<div class="oheng-bars">';
    for(const el of ["목","화","토","금","수"]){
        const c = ohengCount[el];
        const pct = Math.round((c/(pillars.length*2))*100);
        html += `
        <div class="oheng-row">
            <div class="name">${ohengLabel(el)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${OHENG_COLOR[el]}"></div></div>
            <div class="count">${c}</div>
        </div>`;
    }
    html += '</div>';

    box.innerHTML = html;

    lastSajuResult = {
        dayGanIdx: day.ganIdx,
        ohengCount
    };
}

const SAMHAP_GROUPS = [ [11,3,7,"목"], [2,6,10,"화"], [5,9,1,"금"], [8,0,4,"수"] ];
const YUKHAP_PAIRS = [[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const CHUNG_PAIRS = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];

function hasBatchim(char){
    const code = char.charCodeAt(0) - 0xAC00;
    if(code<0 || code>11171) return false;
    return (code%28)!==0;
}

function josaWaGwa(word){
    return hasBatchim(word[word.length-1]) ? "과" : "와";
}

function getJiRelation(z1,z2){
    if(z1===z2) return { type:"same" };
    for(const g of SAMHAP_GROUPS){ if(g.includes(z1) && g.includes(z2)) return { type:"samhap", element:g[3] }; }
    for(const [a,b] of YUKHAP_PAIRS){ if((z1===a&&z2===b)||(z1===b&&z2===a)) return { type:"yukhap" }; }
    for(const [a,b] of CHUNG_PAIRS){ if((z1===a&&z2===b)||(z1===b&&z2===a)) return { type:"chung" }; }
    return { type:"neutral" };
}

        ${jiText}
    </div>`;
    box.innerHTML = html;
}

function calcAiExplain(){
    const box = document.getElementById("aiResult");

    if(!lastSajuResult){
        box.innerHTML = `<p class="empty-hint">${t("aiEmptyHint")}</p>`;
        return;
    }

    const { dayGanIdx, ohengCount } = lastSajuResult;
    const dayGanKey = CHEONGAN[dayGanIdx];
    const dayGanOheng = CHEONGAN_OHENG[dayGanIdx];
    const isKo = LANG.current==="ko";

    let dominant = "목";
    let maxC = -1;
    for(const el of ["목","화","토","금","수"]){
        if(ohengCount[el] > maxC){ maxC = ohengCount[el]; dominant = el; }
    }

    let lack = null;
    for(const el of ["목","화","토","금","수"]){
        if(ohengCount[el]===0){ lack = el; break; }
    }

    const balanced = isKo
        ? "오행이 비교적 고르게 분포되어 있어, 상황에 따라 균형 잡힌 대응이 가능한 사주입니다."
        : "The five elements are fairly evenly distributed, giving you a balanced chart that can adapt to different situations.";

    const paragraph = isKo ? `
        당신의 일간(日干)은 <b>${ganLabel(dayGanIdx)}(${ohengLabel(dayGanOheng)})</b>입니다. ${DAYMASTER_DESC.ko[dayGanKey]}<br><br>
        사주 전체에서는 <b>${ohengLabel(dominant)}</b> 기운이 가장 강하게 나타나, ${OHENG_TRAIT.ko[dominant]}<br><br>
        ${lack ? OHENG_LACK.ko[lack] : balanced}
    ` : `
        Your Day Master is <b>${ganLabel(dayGanIdx)} (${ohengLabel(dayGanOheng)})</b>. ${DAYMASTER_DESC.en[dayGanKey]}<br><br>
        Across your whole chart, <b>${ohengLabel(dominant)}</b> energy stands out the most - ${OHENG_TRAIT.en[dominant]}<br><br>
        ${lack ? OHENG_LACK.en[lack] : balanced}
    `;

    box.innerHTML = `
        <p class="hint">${t("aiDisclaimer")}</p>
        <div class="result-box">${paragraph}</div>
    `;
}

function switchTab(tab){
    document.querySelectorAll(".tab-btn").forEach(btn=>{
        btn.classList.toggle("active", btn.dataset.tab===tab);
    });
    document.querySelectorAll(".tab-panel").forEach(panel=>{
        panel.classList.toggle("active", panel.id==="tab-"+tab);
    });
}

function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("themeToggle").textContent = theme === "dark" ? t("themeLight") : t("themeDark");
    localStorage.setItem("saju-theme", theme);
}

function toggleTheme(){
    const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    applyTheme(current === "dark" ? "light" : "dark");
}

const savedLang = localStorage.getItem("saju-lang");
if(savedLang === "ko" || savedLang === "en") LANG.current = savedLang;

const savedTheme = localStorage.getItem("saju-theme");
const systemPrefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
applyStaticText();
applyTheme(savedTheme || (systemPrefersDark ? "dark" : "light"));
